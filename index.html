main{padding:4px 18px 20px;display:none}
main.active{display:block}
.card{border-bottom:1px solid var(--line);padding:13px 0}
.card:last-child{border-bottom:none}
.head{cursor:pointer}
.name{font-size:15px;font-weight:500;color:var(--text);margin-bottom:3px;line-height:1.4}
.sub{font-size:12.5px;color:var(--muted);line-height:1.4}

.field{margin-bottom:9px}
.field:last-child{margin-bottom:0}
.lbl{font-size:11.5px;color:var(--gold);margin-bottom:3px;letter-spacing:.5px}
.val{font-size:13.5px;color:var(--text);line-height:1.6}
.steps{display:flex;flex-direction:column;gap:5px}
.step{font-size:13.5px;color:var(--text);line-height:1.65;padding-left:18px;position:relative}
.step::before{content:'·';position:absolute;left:6px;color:var(--gold);font-weight:700}
.parts{display:flex;flex-direction:column;gap:4px}
.part{font-size:13.5px;color:var(--text);line-height:1.6;padding-left:14px;position:relative}
.part::before{content:'';position:absolute;left:2px;top:9px;width:4px;height:4px;border-radius:50%;background:var(--gold)}
.mats{font-size:13.5px;color:var(--text);line-height:1.6}
.mat-sep{color:var(--muted);margin:0 4px}
.note{font-size:12.5px;color:var(--muted);line-height:1.6;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.purpose{font-size:13px;color:#a8c8a0;line-height:1.65}
.stats{font-size:13px;color:#c9a961;line-height:1.7;font-variant-numeric:tabular-nums}
.empty{text-align:center;color:var(--muted);padding:60px 20px;font-size:14px}
footer{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:1px solid var(--line);padding:11px 18px calc(11px + env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:space-between;font-size:12px;z-index:99}
#progress{color:var(--muted)}
</style>

// ==================== 配置 ====================
const ITEM_CATS = ['全部','第一章 · 欢乐堡','第二章 · 死神海岸','第三章 · 无名岛','第四章 · 阿克斯城','神器套装','特殊道具'];
const RECIPE_CATS = ['全部','基础材料','武器防具','药水药剂','法术卷轴','箭矢','符文','伪装面具','特殊合成'];
const QUEST_CATS = ['全部','主线','支线','同伴'];

let curTab = 'items';
let catItems = '全部', catRecipes = '全部', catQuests = '全部';

const $stat = document.getElementById('stat');
const $cats = document.getElementById('cats');
const $search = document.getElementById('search');
const $progress = document.getElementById('progress');

document.querySelectorAll('.tab').forEach(t=>{
  t.onclick = ()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    curTab = t.dataset.tab;
    document.querySelectorAll('main').forEach(m=>m.classList.remove('active'));
    document.getElementById('tab-'+curTab).classList.add('active');
    $search.value = '';
    renderCats();
    render();
  };
});

$search.addEventListener('input', render);

function renderCats(){
  const list = curTab==='items' ? ITEM_CATS : curTab==='recipes' ? RECIPE_CATS : QUEST_CATS;
  const cur = curTab==='items' ? catItems : curTab==='recipes' ? catRecipes : catQuests;
  $cats.innerHTML = '';
  list.forEach(c=>{
    const b = document.createElement('button');
    b.className = 'cat' + (c===cur ? ' active' : '');
    b.textContent = c;
    b.onclick = ()=>{
      if(curTab==='items') catItems = c;
      else if(curTab==='recipes') catRecipes = c;
      else catQuests = c;
      renderCats();
      render();
    };
    $cats.appendChild(b);
  });
}

function render(){
  if(curTab==='items') renderItems();
  else if(curTab==='recipes') renderRecipes();
  else renderQuests();
  updateCounts();
}

function renderItems(){
  const $l = document.getElementById('tab-items');
  $l.innerHTML = '';
  const q = $search.value.trim().toLowerCase();
  let arr = ITEMS;
  if(catItems !== '全部') arr = arr.filter(i=>i.c===catItems);
  if(q){
    arr = arr.filter(i=>{
      const p = (i.parts||[]).join(' ');
      return (i.n+i.loc+i.how+(i.note||'')+(i.purpose||'')+(i.stats||'')+p).toLowerCase().includes(q);
    });
  }
  $stat.textContent = arr.length + ' 条';
  if(!arr.length){ $l.innerHTML = '<div class="empty">未找到</div>'; return; }

  arr.forEach(it=>{
    const card = document.createElement('div');
    card.className = 'card';

    let detail = '';
    if(it.how) detail += `<div class="field"><div class="lbl">获取</div><div class="val">${it.how}</div></div>`;
    if(it.purpose) detail += `<div class="field"><div class="lbl">用途</div><div class="purpose">${it.purpose}</div></div>`;
    if(it.stats) detail += `<div class="field"><div class="lbl">属性</div><div class="stats">${it.stats.replace(/\n/g,'<br>')}</div></div>`;
    if(it.parts && it.parts.length){
      detail += `<div class="field"><div class="lbl">部件</div><div class="parts">${
        it.parts.map(p=>`<div class="part">${p}</div>`).join('')
      }</div></div>`;
    }
    if(it.note) detail += `<div class="note">${it.note}</div>`;

    card.innerHTML = `
      <div class="head">
        <div class="name">${it.n}</div>
        <div class="sub">${it.c} · ${it.loc}</div>
      </div>
      <div class="detail">${detail}</div>
    `;
    card.querySelector('.head').onclick = ()=> card.classList.toggle('open');
    $l.appendChild(card);
  });
}

function renderRecipes(){
  const $l = document.getElementById('tab-recipes');
  $l.innerHTML = '';
  const q = $search.value.trim().toLowerCase();
  let arr = RECIPES;
  if(catRecipes !== '全部') arr = arr.filter(r=>r.cat===catRecipes);
  if(q){
    arr = arr.filter(r=>{
      const h = (r.result + ' ' + r.mats.join(' ') + (r.note||'') + (r.tool||'') + (r.purpose||'')).toLowerCase();
      return h.includes(q);
    });
  }
  $stat.textContent = arr.length + ' 条';
  if(!arr.length){ $l.innerHTML = '<div class="empty">未找到</div>'; return; }

  arr.forEach(r=>{
    const card = document.createElement('div');
    card.className = 'card';

    const mats = r.mats.map(m=>`<span>${m}</span>`).join('<span class="mat-sep">+</span>');
    const tool = r.tool ? `<span class="mat-sep">· 需 ${r.tool}</span>` : '';

    let detail = `<div class="field"><div class="lbl">材料</div><div class="mats">${mats}${tool}</div></div>`;
    if(r.purpose) detail += `<div class="field"><div class="lbl">用途</div><div class="purpose">${r.purpose}</div></div>`;
    if(r.note) detail += `<div class="note">${r.note}</div>`;

    card.innerHTML = `
      <div class="head">
        <div class="name">${r.result}</div>
        <div class="sub">${r.cat}</div>
      </div>
      <div class="detail">${detail}</div>
    `;
    card.querySelector('.head').onclick = ()=> card.classList.toggle('open');
    $l.appendChild(card);
  });
}

function renderQuests(){
  const $l = document.getElementById('tab-quests');
  $l.innerHTML = '';
  const q = $search.value.trim().toLowerCase();
  let arr = QUESTS;
  if(catQuests !== '全部') arr = arr.filter(x=>x.c===catQuests);
  if(q){
    arr = arr.filter(x=>{
      const s = (x.steps||[]).join(' ');
      const r = (x.rewards||[]).join(' ');
      return (x.n + x.t + x.loc + s + (x.note||'') + r).toLowerCase().includes(q);
    });
  }
  $stat.textContent = arr.length + ' 条';
  if(!arr.length){ $l.innerHTML = '<div class="empty">未找到</div>'; return; }

  arr.forEach(it=>{
    const card = document.createElement('div');
    card.className = 'card';

    let detail = '';
    if(it.steps && it.steps.length){
      detail += `<div class="field"><div class="lbl">流程</div><div class="steps">${
        it.steps.map(s=>`<div class="step">${s}</div>`).join('')
      }</div></div>`;
    }
    if(it.rewards && it.rewards.length){
      detail += `<div class="field"><div class="lbl">奖励</div><div class="parts">${
        it.rewards.map(r=>`<div class="part">${r}</div>`).join('')
      }</div></div>`;
    }
    if(it.note) detail += `<div class="note">${it.note}</div>`;

    card.innerHTML = `
      <div class="head">
        <div class="name">${it.n}</div>
        <div class="sub">${it.t} · ${it.loc}</div>
      </div>
      <div class="detail">${detail}</div>
    `;
    card.querySelector('.head').onclick = ()=> card.classList.toggle('open');
    $l.appendChild(card);
  });
}

function updateCounts(){
  $progress.textContent = `物品 ${ITEMS.length} · 合成 ${RECIPES.length} · 任务 ${QUESTS.length}`;
}

renderCats();
render();
</script>
